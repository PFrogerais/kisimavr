# Build the plug-in and run the ctest suite (cosim_runner + ngspice).
#
# Runs in a Fedora container: the plug-in needs ngspice >= 44 (sim_args),
# while Ubuntu 24.04 ships ngspice 42. Fedora is also the reference
# platform of the README.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # simavr is not packaged with its headers everywhere: built from source,
  # pinned for reproducible results. Bump deliberately.
  SIMAVR_REPO: https://github.com/buserror/simavr.git
  SIMAVR_REV: 13d4ed32433ad7a37bb757b7e0f7dbb5373396c0

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: fedora:45
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: Release
            cxx_flags: -Werror
            linker_flags: ""
            ctest_args: ""
          # AddressSanitizer + UBSan on the plug-in, the runner and the unit
          # tests. ngspice itself is not instrumented, so it cannot load an
          # ASan plug-in: the ngspice test is excluded here.
          - name: sanitizers
            build_type: Debug
            cxx_flags: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
            linker_flags: -fsanitize=address,undefined
            ctest_args: --label-exclude ngspice
    env:
      # simavr (not instrumented) frees little at exit: leaks are not checked.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - name: Install tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
              git cmake gcc-c++ make pkgconf-pkg-config elfutils-libelf-devel \
              avr-gcc avr-libc avr-binutils ngspice ngspice-codemodel python3 \
              libasan libubsan which clang lld llvm   # which: simavr Makefiles; clang: Pico firmware
          ngspice -v | head -n 3

      # kicad-cli: ERC of the demo projects and SPICE netlist of Arduino_UNO
      # (release job only: the netlist is simulated by ngspice).
      - name: Install KiCad
        if: matrix.name == 'release'
        run: |
          dnf install -y --setopt=install_weak_deps=False kicad
          kicad-cli version
          # Temporary: dump the official Raspberry Pi Pico symbol.
          awk '/^\t\(symbol "RaspberryPi_Pico"$/,/^\t\(symbol "RaspberryPi_Pico_Debug"$/' \
              /usr/share/kicad/symbols/MCU_Module.kicad_sym | sed 's/^/PICOSYM|/' || true

      # After the tools: checkout then uses git.
      - uses: actions/checkout@v4

      - name: Cache simavr
        id: simavr-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: simavr-fedora45-${{ env.SIMAVR_REV }}

      - name: Build simavr
        if: steps.simavr-cache.outputs.cache-hit != 'true'
        run: |
          git init -q simavr-src
          git -C simavr-src fetch -q --depth 1 "$SIMAVR_REPO" "$SIMAVR_REV"
          git -C simavr-src checkout -q FETCH_HEAD
          make -C simavr-src/simavr RELEASE=1 -j"$(nproc)"
          make -C simavr-src/simavr install RELEASE=1 DESTDIR="$HOME/.local"

      # build/ (not another folder): ngspice/full_test.cir loads
      # ../build/mcu_cosim.so, so the ngspice test is only enabled there.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          "-DCMAKE_CXX_FLAGS=${{ matrix.cxx_flags }}"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.linker_flags }}"
          "-DCMAKE_MODULE_LINKER_FLAGS=${{ matrix.linker_flags }}"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure ${{ matrix.ctest_args }}

      - name: Show the KiCad netlist (debug)
        if: failure() && matrix.name == 'release'
        run: cat build/tests/kicad/Arduino_UNO.cir || true
