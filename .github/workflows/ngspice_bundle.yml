# Temporary: removes the scratch branch of the debugging session.
name: ngspice bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the scratch branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q x && cd x
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete ngspice-bundle
