# Temporary: packs Fedora's ngspice with its code models and libraries,
# so that it can be run elsewhere through the bundled dynamic loader.
name: ngspice bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    container: fedora:45
    steps:
      - name: Pack
        run: |
          dnf install -y --setopt=install_weak_deps=False ngspice ngspice-codemodel tar gzip git
          mkdir -p b/lib b/cm b/share
          cp "$(command -v ngspice)" b/
          cp /usr/lib64/ngspice/*.cm b/cm/
          cp -r /usr/share/ngspice/* b/share/ || true
          for f in b/ngspice b/cm/*.cm; do
              ldd "$f" | awk '/=> \//{print $3} /ld-linux/{print $1}' ; done \
              | sort -u | xargs -I{} cp -L {} b/lib/
          ls -la b b/lib b/cm
          tar czf ngspice_bundle.tgz b
      - name: Push to a temporary branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir pub && cd pub && git init -q -b ngspice-bundle
          cp ../ngspice_bundle.tgz .
          git -c user.name=ci -c user.email=ci@localhost add . 
          git -c user.name=ci -c user.email=ci@localhost commit -qm bundle
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ngspice-bundle
