# Temporary: packs Fedora's ngspice with its code models and libraries,
# so that it can be run elsewhere through the bundled dynamic loader.
name: ngspice bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    container: fedora:45
    steps:
      - name: Pack
        run: |
          dnf install -y --setopt=install_weak_deps=False flex tar gzip git
          git clone -q --depth 1 https://github.com/imr/ngspice.git src
          cd src/src/xspice/cmpp
          flex -o mod_lex.c mod_lex.l
          flex -o ifs_lex.c ifs_lex.l
          tar czf ../../../../ngspice_bundle.tgz mod_lex.c ifs_lex.c
      - name: Push to a temporary branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir pub && cd pub && git init -q -b ngspice-bundle
          cp ../ngspice_bundle.tgz .
          git -c user.name=ci -c user.email=ci@localhost add . 
          git -c user.name=ci -c user.email=ci@localhost commit -qm bundle
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ngspice-bundle
